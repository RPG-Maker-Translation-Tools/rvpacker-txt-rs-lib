[package]
name = "rvpacker-txt-rs-lib-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[[bin]]
name = "marshal"
path = "fuzz_targets/marshal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process"
path = "fuzz_targets/process.rs"
test = false
doc = false
bench = false

[[bin]]
name = "save"
path = "fuzz_targets/save.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rm2k"
path = "fuzz_targets/rm2k.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4.13"
rm2k-lib = "1.1.0"
rvpacker-txt-rs-lib = { path = "..", features = [
    "serde-csv",
    "serde-xml",
    "serde-xlsx",
    "serde-yaml",
] }
