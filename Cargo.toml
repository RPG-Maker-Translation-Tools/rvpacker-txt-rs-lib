[package]
name = "rvpacker-txt-rs-lib"
version = "17.0.0"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2024"
rust-version = "1.88.0"
description = "Library that allows you to generate text files from RPG Maker files."
documentation = "https://docs.rs/rvpacker-txt-rs-lib"
readme = "README.md"
repository = "https://github.com/savannstm/rvpacker-txt-rs-lib"
license-file = "LICENSE.md"

[package.metadata.cargo-machete]
ignored = ["strum"]

[features]
serde-csv = ["dep:csv"]
serde-xml = ["dep:quick-xml"]
serde-xlsx = ["dep:rust_xlsxwriter", "dep:calamine"]
serde-yaml = ["dep:yaml_serde"]

[dependencies]
bitflags = { version = "2.13.2", features = ["serde"] }
calamine = { version = "0.36.1", optional = true }
csv = { version = "1.4.0", optional = true }
encoding_rs = "0.8.42"
flate2 = { version = "1.1.10", default-features = false, features = [
    "zlib-rs",
] }
gxhash = { version = "3.5.0", features = ["deterministic"] }
indexmap = "2.14.2"
log = "0.4.34"
marshal-rs = { version = "3.3.0" }
num_enum = "0.7.6"
phf = { version = "0.14.0", features = ["macros"] }
quick-xml = { version = "0.42.0", optional = true }
regex = "1.13.1"
rm2k-lib = { version = "1.0.0", features = ["serde"] }
rust_xlsxwriter = { version = "0.99.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
smallvec = "1.16.2"
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
thiserror = "2.0.21"
yaml_serde = { version = "0.10.7", optional = true }
